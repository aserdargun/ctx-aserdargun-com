      <h1>Context &amp; Knowledge Engineering</h1>
      <p>
        A bilingual, source-backed field guide to the information system that runs before a model answers,
        from ingestion and retrieval through citation, caching, and memory.
      </p>
      <p>
        The interactive observatory needs JavaScript. These are the stages the pipeline covers, in order:
      </p>
      <ol>
        <li>Source</li>
        <li>Ingest</li>
        <li>Parse</li>
        <li>Chunk</li>
        <li>Index</li>
        <li>Retrieve</li>
        <li>Rerank</li>
        <li>Assemble</li>
        <li>Cite</li>
        <li>Cache</li>
        <li>Memory</li>
      </ol>
      <p>
        Model yanıtından önce çalışan bilgi sistemini alım ve erişimden alıntılama, önbellekleme ve belleğe
        kadar tasarlamaya yarayan iki dilli, kaynaklı alan rehberi. Etkileşimli gözlemevi için JavaScript
        gerekir.
      </p>
